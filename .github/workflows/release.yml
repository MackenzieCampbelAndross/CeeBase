name: Release CeeBase Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build Release - ${{ matrix.os }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            package_name: ceebase-windows-x64.zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            package_name: ceebase-linux-x64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            package_name: ceebase-darwin-arm64.tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Build C++ Shared Library (CMake)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCEEBASE_BUILD_TESTS=OFF
          cmake --build build --config Release --target ceebase_shared

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build CeeBase CLI (Rust)
        run: cargo build --release --manifest-path tools/cli/Cargo.toml --target ${{ matrix.target }}

      - name: Package Artifact (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $DistDir = "dist-windows"
          New-Item -ItemType Directory -Path $DistDir -Force
          Copy-Item "tools/cli/target/${{ matrix.target }}/release/ceebase.exe" "$DistDir/ceebase.exe"
          $Dll = Get-ChildItem -Recurse build -Filter "*ceebase*.dll" | Select-Object -First 1
          if ($Dll) { Copy-Item $Dll.FullName "$DistDir/libceebase.dll" }
          Compress-Archive -Path "$DistDir/*" -DestinationPath "${{ matrix.package_name }}"

      - name: Package Artifact (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          DIST_DIR="dist-unix"
          mkdir -p "$DIST_DIR"
          cp "tools/cli/target/${{ matrix.target }}/release/ceebase" "$DIST_DIR/"
          find build -type f \( -name "*ceebase*.dylib" -o -name "*ceebase*.so" \) -exec cp {} "$DIST_DIR/" \;
          tar -czf "${{ matrix.package_name }}" -C "$DIST_DIR" .

      - name: Upload Package to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.package_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
