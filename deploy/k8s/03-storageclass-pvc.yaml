apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ceebase-primary-pvc
  namespace: ceebase-system
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ceebase-standby-pvc
  namespace: ceebase-system
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ceebase-backup-pvc
  namespace: ceebase-system
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 200Gi
