version: "3.8"

services:
  ceebase-primary:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: ceebase:1.0.0
    container_name: ceebase-primary
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - CEEBASE_PORT=8080
      - CEEBASE_HOST=0.0.0.0
      - CEEBASE_DATABASE=/var/lib/ceebase/data/ceebase.cbdb
      - CEEBASE_ROLE=PRIMARY
      - CEEBASE_EPOCH=1
    volumes:
      - ceebase_primary_data:/var/lib/ceebase/data
      - ceebase_shared_backups:/var/lib/ceebase/backups
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4096M
        reservations:
          cpus: "0.5"
          memory: 1024M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  ceebase-standby:
    image: ceebase:1.0.0
    container_name: ceebase-standby
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      - CEEBASE_PORT=8080
      - CEEBASE_HOST=0.0.0.0
      - CEEBASE_DATABASE=/var/lib/ceebase/data/ceebase_standby.cbdb
      - CEEBASE_ROLE=STANDBY
      - CEEBASE_PRIMARY_URL=http://ceebase-primary:8080
      - CEEBASE_EPOCH=1
    volumes:
      - ceebase_standby_data:/var/lib/ceebase/data
    depends_on:
      ceebase-primary:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2048M

  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: ceebase-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    depends_on:
      - ceebase-primary

  grafana:
    image: grafana/grafana:10.3.3
    container_name: ceebase-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=CeeBaseAdmin2026!
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  backup-sidecar:
    image: ceebase:1.0.0
    container_name: ceebase-backup-agent
    restart: unless-stopped
    environment:
      - BACKUP_INTERVAL_SECONDS=3600
      - KEEP_BACKUPS_COUNT=7
      - BACKUP_SOURCE_DB=/var/lib/ceebase/data/ceebase.cbdb
    volumes:
      - ceebase_primary_data:/var/lib/ceebase/data:ro
      - ceebase_shared_backups:/var/lib/ceebase/backups
    entrypoint: ["python3", "-c", "import time, sys; from src.infra.backup_manager import BackupManager; bm = BackupManager('/var/lib/ceebase/backups'); print('Backup agent running...'); sys.stdout.flush(); [time.sleep(3600) or bm.create_full_backup('/var/lib/ceebase/data/ceebase.cbdb') for _ in iter(int, 1)]"]
    depends_on:
      ceebase-primary:
        condition: service_healthy

volumes:
  ceebase_primary_data:
  ceebase_standby_data:
  ceebase_shared_backups:
  prometheus_data:
  grafana_data:
