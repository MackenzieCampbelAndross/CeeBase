[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ceebase"
version = "1.0.0"
authors = [
  { name="CeeBase Team", email="mackenzieandross@gmail.com" },
]
description = "Python DB-API 2.0 driver for CeeBase Relational Database Engine"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Database",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ceebase*"]
